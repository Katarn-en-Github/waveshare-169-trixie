# Configuración de Waveshare 1.69" ST7789V2
#
# Archivo de configuración del proyecto waveshare-169-trixie.
# Formato compatible con Bash y POSIX Shell.
#
# Orientación predeterminada: 0 grados (vertical).
# Resolución: 240 x 280 píxeles.
# Velocidad SPI: 32 MHz.
#
# Este archivo será leído por install.sh.
# No debe copiarse directamente a /boot/firmware/config.txt.

# --------------------------------------------------
# Configuración general
# --------------------------------------------------

DISPLAY_MODEL="Waveshare 1.69 ST7789V2"

# Orientación predeterminada en grados.
DISPLAY_ORIENTATION="0"

# Orientaciones comprobadas en el proyecto.
SUPPORTED_ORIENTATIONS="0 90 180 270"

# --------------------------------------------------
# Comunicación SPI
# --------------------------------------------------

# SPI0, dispositivo CE0.
SPI_DEVICE="spi0-0"

# Velocidad máxima de comunicación SPI, en Hz.
SPI_SPEED_HZ="32000000"

# La pantalla utiliza comunicación de escritura.
SPI_WRITE_ONLY="1"

# --------------------------------------------------
# Resolución y desplazamiento
# Orientación predeterminada: 0 grados.
# --------------------------------------------------

DISPLAY_WIDTH="240"
DISPLAY_HEIGHT="280"

DISPLAY_X_OFFSET="0"
DISPLAY_Y_OFFSET="20"

# Registro MADCTL del ST7789V2.
# El valor efectivo se encuentra en panel.bin.
DISPLAY_MADCTL="0x00"

# --------------------------------------------------
# Pines GPIO (numeración BCM)
# --------------------------------------------------

GPIO_RESET="27"
GPIO_DC="25"
GPIO_BACKLIGHT="18"

# --------------------------------------------------
# Firmware
# --------------------------------------------------

# Nombre del firmware de inicialización.
PANEL_FIRMWARE="panel.bin"

# Ubicación de instalación en Raspberry Pi OS.
PANEL_FIRMWARE_DIR="/lib/firmware"

# --------------------------------------------------
# Configuración de arranque
# --------------------------------------------------

# Archivo de configuración de Raspberry Pi.
BOOT_CONFIG="/boot/firmware/config.txt"

# Nombre del Device Tree Overlay.
DISPLAY_OVERLAY="mipi-dbi-spi"

# --------------------------------------------------
# Fin de la configuración
# --------------------------------------------------
